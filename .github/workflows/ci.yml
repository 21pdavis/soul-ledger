name: CI

# One run per change (ADR 0047): PRs, plus pushes to the long-lived branches.
# Two depths (ADR 0063): a PR into staging runs the smoke end-to-end set; anything aimed at main
# (the staging -> main PR, and pushes to main) runs the full suite with coverage.
on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docs-only PRs (markdown, wiki/, .claude/) skip typecheck, tests and e2e.
      # Pushes to main/staging and any PR touching other files run everything.
      - name: Classify changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.base_ref }}" = "main" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"; echo "$files"
          if echo "$files" | grep -qvE '(\.md$|^wiki/|^\.claude/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: running format, lint and wiki check only."
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Wiki check (OKF)
        run: pnpm check:wiki

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck

      # Integration tests use in-process PGlite, so no database service is needed.
      - name: Unit and integration tests
        if: steps.changes.outputs.code == 'true' && steps.changes.outputs.full != 'true'
        run: pnpm test

      - name: Unit and integration tests with coverage (full)
        if: steps.changes.outputs.code == 'true' && steps.changes.outputs.full == 'true'
        run: pnpm test:coverage

      - name: Install Playwright browser
        if: steps.changes.outputs.code == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Smoke: every spec except the worst-case slide-fit matrix, which keeps its tightest phone size
      # (360x640). The rest of that matrix runs in the full suite.
      - name: End-to-end tests, smoke (phone and desktop)
        if: steps.changes.outputs.code == 'true' && steps.changes.outputs.full != 'true'
        run: pnpm test:e2e:smoke

      - name: End-to-end tests, full (phone and desktop)
        if: steps.changes.outputs.code == 'true' && steps.changes.outputs.full == 'true'
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure() && steps.changes.outputs.code == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
